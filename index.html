<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recibo</title>

<style>

@page {
    size: 58mm auto;
    margin: 0;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 58mm;
    background: white;
}

body {
    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: 500;
    color: black;
}

/* RECIBO */

.recibo {
    width: 58mm;
    padding: 3mm 2mm;
}

/* TÍTULO */

.centro {
    text-align: center;
}

.titulo {
    font-weight: bold;
    font-size: 21px;
    margin-bottom: 10px;
}

/* FECHA Y HORA */

.fecha-hora {
    font-size: 15px;
    line-height: 1.5;
}

/* LÍNEA */

.linea {
    border-top: 2px dashed black;
    margin: 10px 0;
}

/* FILAS */

.fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    margin: 9px 0;
    line-height: 1.25;
}

.etiqueta {
    flex-shrink: 0;
}

.valor {
    text-align: right;
}

/* CAMPOS EDITABLES */

.editable {
    border: none;
    outline: none;
    background: transparent;
    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: 500;
    color: black;
    text-align: right;
    padding: 0;
    margin: 0;
}

.editable:focus {
    background: #eeeeee;
}

/* ENVIADOR */

#enviador {
    width: 105px;
}

/* MONTOS */

.monto-input {
    width: 75px;
}

/* TOTAL */

.total {
    font-weight: bold;
    font-size: 17px;
    margin-top: 11px;
}

/* ASTERISCOS */

.asteriscos {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.4;
}

/* PIE */

.pie {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
}


/* ============================= */
/* IMPRESIÓN */
/* ============================= */

@media print {

    html, body {
        width: 58mm;
        margin: 0;
        padding: 0;
    }

    .recibo {
        width: 58mm;
        padding: 3mm 2mm;
    }

    .editable {
        background: transparent !important;
    }

    input {
        border: none !important;
        outline: none !important;
    }

}

</style>

</head>

<body>

<div class="recibo">

```
<!-- TÍTULO -->

<div class="centro titulo">
    RECIBO
</div>


<!-- FECHA Y HORA -->

<div class="centro fecha-hora">

    Fecha:
    <span id="fecha"></span>

    <br>

    Hora:
    <span id="hora"></span>

</div>


<div class="linea"></div>


<!-- ENVIADOR -->

<div class="fila">

    <span class="etiqueta">
        Enviador
    </span>

    <input
        id="enviador"
        class="editable"
        type="text"
        value="OLIMPO"
    >

</div>


<!-- MONTO -->

<div class="fila">

    <span class="etiqueta">
        Monto Enviado
    </span>

    <span class="valor">

        S/.
        <input
            id="monto"
            class="editable monto-input"
            type="number"
            step="0.01"
            value="300.00"
            oninput="actualizarTotal()"
        >

    </span>

</div>


<!-- COMISIÓN -->

<div class="fila">

    <span class="etiqueta">
        Comisión
    </span>

    <span class="valor">

        S/.
        <input
            id="comision"
            class="editable monto-input"
            type="number"
            step="0.01"
            value="3.00"
            oninput="actualizarTotal()"
        >

    </span>

</div>


<div class="linea"></div>


<!-- TOTAL -->

<div class="fila total">

    <span class="etiqueta">
        Total Transferido
    </span>

    <span class="valor">

        S/.
        <span id="total">
            297.00
        </span>

    </span>

</div>


<!-- DECORACIÓN -->

<div class="asteriscos">

    ************************

    <br>

    ************************

</div>


<!-- PIE -->

<div class="pie">
    Made with Thermmer
</div>
```

</div>

<script>

/* ============================= */
/* FECHA Y HORA */
/* ============================= */

function actualizarFechaHora() {

    const ahora = new Date();

    const dia = String(
        ahora.getDate()
    ).padStart(2, "0");

    const mes = String(
        ahora.getMonth() + 1
    ).padStart(2, "0");

    const año = ahora.getFullYear();

    const hora = String(
        ahora.getHours()
    ).padStart(2, "0");

    const minutos = String(
        ahora.getMinutes()
    ).padStart(2, "0");

    document.getElementById("fecha").textContent =
        dia + "/" + mes + "/" + año;

    document.getElementById("hora").textContent =
        hora + ":" + minutos;
}


/* ============================= */
/* CALCULAR TOTAL */
/* ============================= */

function actualizarTotal() {

    const monto =
        Number(
            document.getElementById("monto").value
        ) || 0;

    const comision =
        Number(
            document.getElementById("comision").value
        ) || 0;

    const total =
        monto - comision;

    document.getElementById("total").textContent =
        total.toFixed(2);
}


/* ============================= */
/* INICIO */
/* ============================= */

actualizarFechaHora();

actualizarTotal();


/* Actualizar hora cada minuto */

setInterval(
    actualizarFechaHora,
    60000
);

</script>

</body>
</html>
