<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recibo</title>

<style>

@page {
    size: 58mm auto;
    margin: 0;
}

html, body {
    margin: 0 !important;
    padding: 0 !important;
    width: 58mm;
    height: auto !important;
    min-height: 0 !important;
    background: white;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "Arial Black", "Courier New", monospace;
    font-size: 22px;
    font-weight: 900;
    color: #000;
}

.recibo {
    width: 58mm;
    margin: 0;
    padding: 0 1mm 0 1mm;
}

/* TÍTULO */

.titulo {
    text-align: center;
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
    margin: 0 0 4px 0;
}

/* FECHA Y HORA */

.fecha-hora {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.15;
    margin: 0;
}

/* LÍNEAS */

.linea {
    border-top: 3px dashed #000;
    margin: 4px 0;
}

/* FILAS */

.fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2px;
    margin: 4px 0;
    line-height: 1;
}

.etiqueta {
    flex-shrink: 0;
    font-weight: 900;
}

.valor {
    text-align: right;
    font-weight: 900;
}

/* CAMPOS */

.editable {
    border: none;
    outline: none;
    background: transparent;

    font-family: "Arial Black", "Courier New", monospace;
    font-size: 22px;
    font-weight: 900;

    color: #000;
    text-align: right;

    padding: 0;
    margin: 0;

    -webkit-text-stroke: 0.2px #000;
}

#enviador {
    width: 115px;
}

.monto-input {
    width: 85px;
}

/* TOTAL */

.total {
    font-size: 24px;
    font-weight: 900;
    margin: 5px 0 2px 0;
}

/* FINAL */

.asteriscos {
    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 18px;
    font-weight: 900;
    line-height: 0.9;

    margin: 2px 0 0 0;
    padding: 0;

    -webkit-text-stroke: 0.2px #000;
}

@media print {

    html, body {
        width: 58mm !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    .recibo {
        width: 58mm;
        margin: 0;
        padding: 0 1mm 0 1mm;
    }

    .editable {
        color: #000 !important;
        font-weight: 900 !important;
        -webkit-text-stroke: 0.2px #000;
    }

    input {
        border: none !important;
        outline: none !important;
    }
}

</style>
</head>

<body>

<div class="recibo">

    <div class="titulo">
        RECIBO
    </div>

    <div class="fecha-hora">

        Fecha:
        <span id="fecha"></span>

        <br>

        Hora:
        <span id="hora"></span>

    </div>

    <div class="linea"></div>

    <div class="fila">

        <span class="etiqueta">
            Enviador
        </span>

        <input
            id="enviador"
            class="editable"
            type="text"
            value="OLIMPO"
        >

    </div>

    <div class="fila">

        <span class="etiqueta">
            Monto Enviado
        </span>

        <span class="valor">

            S/.
            <input
                id="monto"
                class="editable monto-input"
                type="number"
                step="0.01"
                value="300.00"
                oninput="actualizarTotal()"
            >

        </span>

    </div>

    <div class="fila">

        <span class="etiqueta">
            Comisión
        </span>

        <span class="valor">

            S/.
            <input
                id="comision"
                class="editable monto-input"
                type="number"
                step="0.01"
                value="3.00"
                oninput="actualizarTotal()"
            >

        </span>

    </div>

    <div class="linea"></div>

    <div class="fila total">

        <span class="etiqueta">
            Total Transferido
        </span>

        <span class="valor">

            S/.
            <span id="total">297.00</span>

        </span>

    </div>

    <div class="asteriscos">
        ************************
        <br>
        ************************
    </div>

</div>

<script>

function actualizarFechaHora() {

    const ahora = new Date();

    const dia = String(ahora.getDate()).padStart(2, "0");
    const mes = String(ahora.getMonth() + 1).padStart(2, "0");
    const año = ahora.getFullYear();

    const hora = String(ahora.getHours()).padStart(2, "0");
    const minutos = String(ahora.getMinutes()).padStart(2, "0");

    document.getElementById("fecha").textContent =
        dia + "/" + mes + "/" + año;

    document.getElementById("hora").textContent =
        hora + ":" + minutos;
}

function actualizarTotal() {

    const monto =
        Number(document.getElementById("monto").value) || 0;

    const comision =
        Number(document.getElementById("comision").value) || 0;

    document.getElementById("total").textContent =
        (monto - comision).toFixed(2);
}

actualizarFechaHora();
actualizarTotal();

setInterval(actualizarFechaHora, 60000);

</script>

</body>
</html>
