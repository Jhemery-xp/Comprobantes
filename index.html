<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recibo</title>

<style>

@page {
    size: 58mm auto;
    margin: 0;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 58mm;
    background: white;
}

body {
    font-family: "Arial Black", "Courier New", monospace;
    font-size: 22px;
    font-weight: 900;
    color: #000000;
}

/* RECIBO */

.recibo {
    width: 58mm;
    padding: 1mm 1mm 0 1mm;
}

/* TÍTULO */

.centro {
    text-align: center;
}

.titulo {
    font-size: 32px;
    font-weight: 900;
    margin: 0 0 6px 0;
    line-height: 1;
}

/* FECHA Y HORA */

.fecha-hora {
    font-family: "Courier New", monospace;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.25;
}

/* LÍNEAS */

.linea {
    border-top: 3px dashed #000;
    margin: 6px 0;
}

/* FILAS */

.fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 2px;
    margin: 6px 0;
    line-height: 1.1;
}

.etiqueta {
    flex-shrink: 0;
    font-weight: 900;
}

.valor {
    text-align: right;
    font-weight: 900;
}

/* CAMPOS EDITABLES */

.editable {
    border: none;
    outline: none;
    background: transparent;

    font-family: "Arial Black", "Courier New", monospace;
    font-size: 22px;
    font-weight: 900;

    color: #000000;
    text-align: right;

    padding: 0;
    margin: 0;

    -webkit-text-stroke: 0.2px #000;
}

/* ENVIADOR */

#enviador {
    width: 115px;
}

/* MONTOS */

.monto-input {
    width: 85px;
}

/* TOTAL */

.total {
    font-size: 24px;
    font-weight: 900;
    margin-top: 7px;
    margin-bottom: 4px;
}

/* ASTERISCOS */

.asteriscos {
    text-align: center;
    margin-top: 6px;
    margin-bottom: 0;
    padding-bottom: 0;

    font-family: "Courier New", monospace;
    font-size: 18px;
    font-weight: 900;
    line-height: 1;
    
    -webkit-text-stroke: 0.2px #000;
}

/* IMPRESIÓN */

@media print {

    html,
    body {
        width: 58mm;
        margin: 0;
        padding: 0;
    }

    .recibo {
        width: 58mm;
        padding: 1mm 1mm 0 1mm;
    }

    .editable {
        background: transparent !important;
        color: #000000 !important;
        font-weight: 900 !important;
        -webkit-text-stroke: 0.2px #000;
    }

    input {
        border: none !important;
        outline: none !important;
    }
}

</style>
</head>


<body>

<div class="recibo">

    <div class="centro titulo">
        RECIBO
    </div>


    <div class="centro fecha-hora">

        Fecha:
        <span id="fecha"></span>

        <br>

        Hora:
        <span id="hora"></span>

    </div>


    <div class="linea"></div>


    <div class="fila">

        <span class="etiqueta">
            Enviador
        </span>

        <input
            id="enviador"
            class="editable"
            type="text"
            value="OLIMPO"
        >

    </div>


    <div class="fila">

        <span class="etiqueta">
            Monto Enviado
        </span>

        <span class="valor">

            S/.
            <input
                id="monto"
                class="editable monto-input"
                type="number"
                step="0.01"
                value="300.00"
                oninput="actualizarTotal()"
            >

        </span>

    </div>


    <div class="fila">

        <span class="etiqueta">
            Comisión
        </span>

        <span class="valor">

            S/.
            <input
                id="comision"
                class="editable monto-input"
                type="number"
                step="0.01"
                value="3.00"
                oninput="actualizarTotal()"
            >

        </span>

    </div>


    <div class="linea"></div>


    <div class="fila total">

        <span class="etiqueta">
            Total Transferido
        </span>

        <span class="valor">

            S/.
            <span id="total">
                297.00
            </span>

        </span>

    </div>


    <div class="asteriscos">

        ************************

        <br>

        ************************

    </div>

</div>


<script>

function actualizarFechaHora() {

    const ahora = new Date();

    const dia = String(
        ahora.getDate()
    ).padStart(2, "0");

    const mes = String(
        ahora.getMonth() + 1
    ).padStart(2, "0");

    const año = ahora.getFullYear();

    const hora = String(
        ahora.getHours()
    ).padStart(2, "0");

    const minutos = String(
        ahora.getMinutes()
    ).padStart(2, "0");

    document.getElementById("fecha").textContent =
        dia + "/" + mes + "/" + año;

    document.getElementById("hora").textContent =
        hora + ":" + minutos;
}


function actualizarTotal() {

    const monto =
        Number(
            document.getElementById("monto").value
        ) || 0;

    const comision =
        Number(
            document.getElementById("comision").value
        ) || 0;

    const total =
        monto - comision;

    document.getElementById("total").textContent =
        total.toFixed(2);
}


actualizarFechaHora();

actualizarTotal();

setInterval(
    actualizarFechaHora,
    60000
);

</script>

</body>
</html>
